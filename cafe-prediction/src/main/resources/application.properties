spring.application.name=CafePrediction

# Required settings come from SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cafe_management

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jackson.deserialization.accept-float-as-int=false

server.address=127.0.0.1
server.port=8080
cafe.cors.origin=http://localhost:5173

jwt.secret=${CAFE_JWT_SECRET}
jwt.expiration=900000
jwt.refreshExpiration=604800000

cafe.business-zone=Asia/Kuala_Lumpur

cafe.forecast.url=${CAFE_FORECAST_URL:http://127.0.0.1:5001}
